<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="second-page.css">
</head>
<body>
     <header class="header">
        <div class="header__inner">
            <div class="header__nav-area">
                <a class="brand" href="first-page.html">Griffin</a>
                <nav class="nav" aria-label="ناوبری اصلی">
                    <button class="nav__button">خانه</button>
                    <button class="nav__button">فروشگاه</button>
                    <button class="nav__button">دسته بندی</button>
                    <button class="nav__button">درباره ما</button>
                </nav>
            </div>
            <div class="actions">
                <button class="actions__button actions__button--cart">سبد خرید</button>
                <button class="actions__button actions__button--login">ورود</button>
            </div>
        </div>
    </header>
    <main class="main">
        <div class="container">

            <p class="container__p"> خانه/ دیجیتال و گنجت/ لب تاپ </p>
        </div>
        <div class="gallery">
            <div class="radio" role="radiogroup" aria-label="گزینه‌ها">
                <label class="radio__option radio__option--1" for="radio-option-1">
                    <input type="radio" id="radio-option-1" name="example" value="option1" checked>
                    <img src="/first-page/images/1d7a6151964f2dd6ca605739426a895b77eba04d_1786538646.webp" alt="گزینه اول">
                </label>
                <label class="radio__option radio__option--2" for="radio-option-2">
                    <input type="radio" id="radio-option-2" name="example" value="option2">
                    <img src="/first-page/images/1d7a6151964f2dd6ca605739426a895b77eba04d_1786538646.webp" alt="گزینه دوم">
                </label>
                <label class="radio__option radio__option--3" for="radio-option-3">
                    <input type="radio" id="radio-option-3" name="example" value="option3">
                    <img src="/first-page/images/1d7a6151964f2dd6ca605739426a895b77eba04d_1786538646.webp" alt="گزینه سوم">
                </label>
            </div>
            <div class="main_img">
                <img class="img_1" src="/first-page/images/1d7a6151964f2dd6ca605739426a895b77eba04d_1786538646.webp" alt="تصویر بزرگ گزینه اول">
                <img class="img_2" src="/first-page/images/1d7a6151964f2dd6ca605739426a895b77eba04d_1786538646.webp" alt="تصویر بزرگ گزینه دوم">
                <img class="img_3" src="/first-page/images/1d7a6151964f2dd6ca605739426a895b77eba04d_1786538646.webp" alt="تصویر بزرگ گزینه سوم">
            </div>
            <div class="product-details">
                <p class="label_1">پرفروش</p>
                <div class="product-info">
                    <h1 class="product-info__title">لپ تاپ</h1>
                    <div class="product-info__rating-row">
                        <p class="product-info__rating">★★★★★</p>
                        <p class="product-info__category_2">4/7 از 5 . 128 دیدگاه</p>
                    </div>
                    <p class="product-info__price">قیمت: ۲۵۰۰۰۰۰ تومان</p>
                    <p class="product-info__description">لب تاپی سبک خوش صدا با کیفیت ,بهترین در دنیا,نیست در جهان!!</p>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container footer__inner">
            <p>Griffin : خرید ساده و مطمئن</p>
            <p>پشتیبانی.قوانین و شرایط.اینستاگرام</p>
            <p>1405</p>
        </div>
    </footer>
</body>
</html>
