<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="first-page.css">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <div class="header__nav-area">
                <a class="brand" href="first-page.html">Griffin</a>
                <nav class="nav" aria-label="ناوبری اصلی">
                    <button class="nav__button">خانه</button>
                    <button class="nav__button">فروشگاه</button>
                    <button class="nav__button">دسته بندی</button>
                    <button class="nav__button">درباره ما</button>
                </nav>
            </div>
            <div class="actions">
                <button class="actions__button actions__button--cart">سبد خرید</button>
                <button class="actions__button actions__button--login">ورود</button>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <section class="intro">
                <p class="intro__breadcrumb">خانه/فروشگاه</p>
                <h1 class="intro__title">فروشگاه</h1>
                <p class="intro__text">.محصولات منتخب را با خیال راحت انتخاب کنید </p>
            </section>
        </div>

        <aside class="filters">
            <section class="filters__group filters__group--category">
                <h2 class="filters__title">فیلتر محصولات</h2>
                <hr>
                <div class="filters__options filters__options--checks">
                    <label class="filters__option">
                        دیجیتال و گجت
                        <input type="checkbox" id="checkbox-1" class="filters__input filters__input--check">
                    </label>
                    <label class="filters__option">
                        خانه و سبک زندگی
                        <input type="checkbox" id="checkbox-2" class="filters__input filters__input--check">
                    </label>
                    <label class="filters__option">
                        لوازم شخصی
                        <input type="checkbox" id="checkbox-3" class="filters__input filters__input--check">
                    </label>
                </div>
            </section>
            <hr>
            <section class="filters__group filters__group--price">
                <h2 class="filters__title">محدوده قیمت</h2>
                <div class="filters__options filters__options--radios">
                    <label class="filters__option">
                        کمتر از 2 میلیون
                        <input type="radio" name="price-range" id="radio-1" class="filters__input filters__input--radio">
                    </label>
                    <label class="filters__option">
                        2 تا 5 میلیون
                        <input type="radio" name="price-range" id="radio-2" class="filters__input filters__input--radio">
                    </label>
                    <label class="filters__option">
                        5 میلیون به بالا
                        <input type="radio" name="price-range" id="radio-3" class="filters__input filters__input--radio">
                    </label>
                </div>
            </section>
            <hr>
            <section class="filters__group filters__group--rating">
                <h2 class="filters__title">امتیاز خریدار</h2>
                <div class="filters__options filters__options--checks">
                    <label class="filters__option">
                        4 ستاره به بالا
                        <input type="checkbox" id="buyer-rating" class="filters__input filters__input--rating">
                    </label>
                </div>
            </section>
        </aside>
    </main>

    <footer class="footer">
        <div class="container footer__inner">
            <p>Griffin : خرید ساده و مطمئن</p>
            <p>پشتیبانی.قوانین و شرایط.اینستاگرام</p>
            <p>1405</p>
        </div>
    </footer>
</body>
</html>
